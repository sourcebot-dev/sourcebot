name: Test

on:
  pull_request:
    branches: ["main"]


jobs:
  vulnerability-automation:
    name: Vulnerability automation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Test reconciliation behavior
        run: .github/scripts/test-vulnerability-triage.sh
      - name: Test CVE remediation discovery
        run: .github/scripts/test-cve-remediation.sh
      - name: Test Zoekt sync automation
        run: .github/scripts/test-zoekt-sync.sh

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "true"
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test
