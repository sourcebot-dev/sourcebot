<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="404" viewBox="0 0 1000 404" role="img" aria-labelledby="title desc">
  <title id="title">Your repositories, connected through Sourcebot</title>
  <desc id="desc">Collections of repositories on GitHub, GitLab, Bitbucket, and Azure DevOps connect to Sourcebot. Agents use the API or MCP; humans use Code Search and Ask Sourcebot in the web app.</desc>
  <style>
    :root { color-scheme:light dark; --ink:#36363b; --muted:#626267; --border:#c5c5c0; --wire:#858580; --surface:#f7f7f5; --stack:#edede8; --accent:#0099ff; }
    @media (prefers-color-scheme:dark) { :root { --ink:#edede8; --muted:#b0b0aa; --border:#51514e; --wire:#858580; --surface:#181818; --stack:#232321; --accent:#0099ff; } }
    text { font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; fill:var(--ink); }
    .card { fill:var(--surface); stroke:var(--border); }
    .stack { fill:var(--stack); stroke:var(--border); }
    .wire { fill:none; stroke:var(--wire); stroke-width:1.5; }
    .muted { fill:var(--muted); }
  </style>
  <defs>
    <!-- Code-host marks reused from packages/web/public. -->
